# Appendix A.6.4: Gemini-family optimized prompt with five embedded examples
mode: full
en_split: bea_dev

en_src_path: data/en_bea/dev/bea-dev.src
en_ref_path: data/en_bea/dev/bea-dev.ref0
en_m2_path: data/en_bea/dev/bea-dev.m2

model: gemini-3-flash
llm_backend: litellm_router
agent: gec_single_prompt
prompt_name: taxonomy_optimised_gemini_family

thinking_config:
  thinkingLevel: low
  includeThoughts: false
llm_timeout_seconds: 300

# The optimized examples are part of the prompt itself; do not sample more.
few_shot:
  enabled: false

num_threads: 20
verbosity: false
show_progress: true
log_input_output: false
batch_size: 1
start_index: 0
