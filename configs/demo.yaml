# Interactive API/UI profiles. Credentials are resolved from .env on the server.
demo:
  default_model: qwen3-8b
  max_input_chars: 10000
  max_batch_size: 120

few_shot:
  src_path: data/en_bea/train/bea-train.src
  ref_path: data/en_bea/train/bea-train.ref0
  max_n: 32

llm_router:
  model_list:
    - model_name: qwen3-8b
      litellm_params:
        model: openai/Qwen/Qwen3-8B
        api_base: env:QWEN_API_BASE
        api_key: env:QWEN_API_KEY
    - model_name: gpt-4.1-mini
      litellm_params:
        model: gpt-4.1-mini-2025-04-14
        api_key: env:OPENAI_API_KEY
    - model_name: gpt-5.4
      litellm_params:
        model: gpt-5.4-2026-03-05
        api_key: env:OPENAI_API_KEY
    - model_name: claude-sonnet-4.6
      litellm_params:
        model: claude-sonnet-4-6
        api_key: env:ANTHROPIC_API_KEY
    - model_name: claude-opus-4.6
      litellm_params:
        model: claude-opus-4-6
        api_key: env:ANTHROPIC_API_KEY
    - model_name: gemini-3-flash
      litellm_params:
        model: gemini/gemini-3-flash-preview
        api_key: env:GEMINI_API_KEY
    - model_name: gemini-3.1-pro
      litellm_params:
        model: gemini/gemini-3.1-pro-preview
        api_key: env:GEMINI_API_KEY
  fallbacks: []
  enable_pre_call_checks: true
  cache_responses: true

model_profiles:
  qwen3-8b:
    label: Qwen3-8B · local
    family: Qwen
    default_recipe: a6_1
    output_format: numbered_text
    request_timeout: 300
    temperature_min: 0
    temperature_max: 1
    temperature_default: 0
    request_kwargs:
      max_tokens: 4000
      seed: 42
      extra_body:
        top_k: 1
        chat_template_kwargs:
          enable_thinking: false
  gpt-4.1-mini:
    label: GPT-4.1 mini
    family: OpenAI
    default_recipe: a6_2
    temperature_min: 0
    temperature_max: 2
    temperature_default: 0
  gpt-5.4:
    label: GPT-5.4
    family: OpenAI
    default_recipe: a6_2
    supports_reasoning_effort: true
    temperature_min: 0
    temperature_max: 2
    temperature_default: 0
    temperature_requires_no_reasoning: true
  claude-sonnet-4.6:
    label: Claude Sonnet 4.6
    family: Anthropic
    default_recipe: a6_3
    temperature_min: 0
    temperature_max: 1
    temperature_default: 0
  claude-opus-4.6:
    label: Claude Opus 4.6
    family: Anthropic
    default_recipe: a6_3
    temperature_min: 0
    temperature_max: 1
    temperature_default: 0
  gemini-3-flash:
    label: Gemini 3 Flash
    family: Google
    default_recipe: a6_4
    temperature_min: 0
    temperature_max: 2
    temperature_default: 0
  gemini-3.1-pro:
    label: Gemini 3.1 Pro
    family: Google
    default_recipe: a6_4
    temperature_min: 0
    temperature_max: 2
    temperature_default: 0
